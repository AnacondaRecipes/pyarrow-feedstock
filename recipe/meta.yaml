# Note that this feedstock must be paired with bumping the version of
# `arrow-cpp-feedstock` and the SHA-256 hashes should match between the packages.
{% set name = "pyarrow" %}
{% set version = "26.0.0" %}
{% set build_number = 0 %}
{% set cuda_enabled = (gpu_variant or "").startswith("cuda") %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://archive.apache.org/dist/arrow/arrow-{{ version }}/apache-arrow-{{ version }}.tar.gz
    sha256: b153ef472dd89ef4cb84867ca238f2a3a9347d8f4a78913d16ca2201606f0425
  # test data (commits taken from submodules)
  # downloading by git is broken on windows workers atm
  {% if not win %}
  - git_url: https://github.com/apache/parquet-testing.git
    git_rev: 56653c437c8092f704a092d0d1d4e600124cd49f
    folder: parquet-testing
  - git_url: https://github.com/apache/arrow-testing.git
    git_rev: 9ff285c88565f0f6abc855918c6a342e70e4909c
    folder: arrow-testing
  {% endif %}

build:
  number: {{ build_number + 100 if cuda_enabled else build_number }}
  {% if cuda_enabled %}
  string: cuda{{ cuda_compiler_version | replace('.', '') }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  {% else %}
  string: cpu_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  {% endif %}
  skip: true  # [py<311]
  rpaths:
    - lib/
    - {{ SP_DIR }}/pyarrow
  missing_dso_whitelist:
    # These can be found in {{ SP_DIR }}, see the tests below
    - "*/libarrow_python{{ SHLIB_EXT }}"         # [unix]
    - "*/libarrow_python_flight{{ SHLIB_EXT }}"  # [unix]
    - "*/arrow_python.dll"                       # [win]
    - "*/arrow_python_flight.dll"                # [win]
    - "*/arrow_python_parquet_encryption.dll"    # [win]
  ignore_run_exports:
    # Only needed at build time
    - numpy

requirements:
  build:
    - {{ stdlib('c') }} 
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - ninja-base
    - make  # [unix]
    - git   # [unix]  # required by git_url sources in source section (parquet-testing, arrow-testing)
    # pyarrow's CMake calls find_package(ArrowCUDA) which requires find_package(CUDAToolkit) → needs nvcc
    - {{ compiler('cuda') }}    # [(gpu_variant or "").startswith("cuda")]
  host:
    - pip
    - python
    # Request matching arrow-cpp variant (cpu or cuda build string)
    {% if cuda_enabled %}
    - arrow-cpp {{ version }} cuda{{ cuda_compiler_version | replace('.', '') }}*
    {% else %}
    - arrow-cpp {{ version }} cpu*
    {% endif %}
    - scikit-build-core >=1.0
    - cython >=3.1
    # upstream: libcst>=1.9.0 on py3.15+ for build-time stub docstring extraction
    - libcst >=1.9.0  # [py>=315]
    - libcst >=1.8.6  # [py<315]
    - numpy {{ numpy }}
    - setuptools_scm >=8
    # CUDA: needed for pin_compatible in run section
    - cuda-version {{ cuda_compiler_version }}  # [(gpu_variant or "").startswith("cuda")]
  run:
    - python
    # Gate the CUDA build to GPU hosts. __cuda must be a hard run dep (unbounded):
    # cuda-version only carries __cuda in run_constrained, which does not trigger when
    # the virtual package is absent, and arrow-cpp deliberately keeps __cuda in
    # run_constrained too, so nothing else gates this variant to CUDA hardware.
    # cuda-version handles the version bound.
    - __cuda                                              # [(gpu_variant or "").startswith("cuda")]
    # pyarrow.cuda links arrow_cuda, which only the CUDA arrow-cpp build ships; arrow-cpp's
    # run_export is a version range and does not select the variant.
    - arrow-cpp {{ version }} cuda{{ cuda_compiler_version | replace('.', '') }}*  # [(gpu_variant or "").startswith("cuda")]
    - {{ pin_compatible('cuda-version', max_pin='x.x') }}  # [(gpu_variant or "").startswith("cuda")]

{% set tests_to_skip = "_not_a_real_test" %}

# with pytest.raises(IOError, match="Bucket '.*' not found"):
# Failed: DID NOT RAISE <class 'OSError'>
{% set tests_to_skip = tests_to_skip + " or test_s3_real_aws_region_selection" %}

# pyarrow.lib.ArrowException: Unknown error: Compression block size must be a multiple of memory block size.
{% set tests_to_skip = tests_to_skip + " or test_buffer_readwrite_with_writeoptions" %}

{% set tests_to_skip = tests_to_skip + " or test_s3fs_wrong_region" %}
{% set tests_to_skip = tests_to_skip + " or test_s3_real_aws" %}
{% set tests_to_skip = tests_to_skip + " or test_resolve_s3_region" %}

# ValueError: fromutc: dt.tzinfo is not self
{% set tests_to_skip = tests_to_skip + " or test_timestamp_as_object_non_nanosecond" %}

{% set tests_to_skip = tests_to_skip + " or test_to_pandas_zero_copy" %}   # [(linux or win) and py==314]

#  PermissionError: [WinError 32] The process cannot access the file because it is being used by another process
# ..\_test_env\lib\pathlib.py:1206: PermissionError
{% set tests_to_skip = tests_to_skip + " or test_relative_paths" %}   # [win]

# pyarrow.lib.ArrowNotImplementedError: This Arrow build does not enable mimalloc
# - pyarrow\tests\test_memory.py::test_memory_pool_factories
{% set tests_to_skip = tests_to_skip + " or test_memory_pool_factories" %} # [win]

# Exception: Unrecognized table name
# - pyarrow\tests\test_memory.py::test_supported_memory_backends
{% set tests_to_skip = tests_to_skip + " or test_supported_memory_backends" %} # [win]

# assert False + where False = any(<generator object test_get_library_dirs_win32.<locals>.<genexpr> at 0x0000025041A59E40>)
# - pyarrow\tests\test_misc.py::test_get_library_dirs_win32
{% set tests_to_skip = tests_to_skip + " or test_get_library_dirs_win32" %} # [win]

# Unsupported backend 'mimalloc' specified in ARROW_DEFAULT_MEMORY_POOL (supported backends are 'system')
# - pyarrow\tests\test_memory.py::test_env_var
{% set tests_to_skip = tests_to_skip + " or test_env_var" %} # [win]

# Tests requiring ARROW_TEST_DATA - not available on windows
{% set tests_to_skip = tests_to_skip + " or test_tls_do_get" %}                       # [win]
{% set tests_to_skip = tests_to_skip + " or test_tls_disable_server_verification" %}  # [win]
{% set tests_to_skip = tests_to_skip + " or test_tls_override_hostname" %}            # [win]
{% set tests_to_skip = tests_to_skip + " or test_mtls" %}                             # [win]
{% set tests_to_skip = tests_to_skip + " or test_generic_options" %}                  # [win]

# Tests requiring PARQUET_TEST_DATA - not available on windows
{% set tests_to_skip = tests_to_skip + " or test_undefined_logical_type" %}           # [win]
{% set tests_to_skip = tests_to_skip + " or test_column_chunk_key_value_metadata" %}  # [win]
{% set tests_to_skip = tests_to_skip + " or test_read_undefined_logical_type" %}      # [win]
{% set tests_to_skip = tests_to_skip + " or test_geospatial_types" %}                 # [win]

test:
  source_files:
    - parquet-testing  # [not win]
    - arrow-testing  # [not win]
  imports:
    - pyarrow
    - pyarrow.lib
    - pyarrow.compute
    - pyarrow.acero
    - pyarrow.csv
    - pyarrow.dataset
    - pyarrow.flight
    - pyarrow.json
    - pyarrow.orc
    - pyarrow.parquet
    - pyarrow.fs
    - pyarrow._s3fs
    - pyarrow._hdfs
  commands:
    - pip check
    - python -c "import pyarrow.cuda"  # [(linux or win) and (gpu_variant or "").startswith("cuda")]
    # Check for pytests in the site-package dir
    - test -f ${SP_DIR}/pyarrow/tests/test_array.py  # [unix]
    - if not exist %SP_DIR%/pyarrow/tests/test_array.py exit 1  # [win]

    # Check on shared objects
    - test -f ${SP_DIR}/pyarrow/libarrow_python_flight${SHLIB_EXT}  # [unix]
    - test -f ${SP_DIR}/pyarrow/libarrow_python${SHLIB_EXT}  # [unix]
    - if not exist %SP_DIR%\pyarrow\arrow_python.dll exit 1  # [win]
    - if not exist %SP_DIR%\pyarrow\arrow_python_flight.dll exit 1  # [win]

    # Run all the tests:
    # https://arrow.apache.org/docs/developers/guide/step_by_step/testing.html
    # Tests disabled on all osx targets. Changing the open file descriptors max count on the OSX target is not a good idea.     
    # OSError: [Errno 24] Too many open files
    - ARROW_TEST_DATA=arrow-testing/data PARQUET_TEST_DATA=parquet-testing/data python -m pytest -vv -k "not ({{ tests_to_skip }})" ${SP_DIR}/pyarrow  # [linux]
    - python -m pytest -vv -k "not ({{ tests_to_skip }})" %SP_DIR%/pyarrow  # [win]

  requires:
    - pip
    - pytest
    - cffi
    - cloudpickle
    - scipy
    - fsspec
    - hypothesis
    - pandas
    - pytz
    # s3fs is not available on win-arm64; the tests that need it skip themselves
    - s3fs >=2023  # [win and x86_64]
    - fastparquet  # [win]

about:
  home: https://github.com/apache/arrow
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE.txt
    - NOTICE.txt
  summary: Python libraries for Apache Arrow
  description: |
    This library provides a Python API for functionality provided by the Arrow C++ libraries, 
    along with tools for Arrow integration and interoperability with pandas, NumPy, and other 
    software in the Python ecosystem.
  dev_url: https://github.com/apache/arrow/tree/main/python
  doc_url: https://arrow.apache.org/docs/python

extra:
  recipe-maintainers:
