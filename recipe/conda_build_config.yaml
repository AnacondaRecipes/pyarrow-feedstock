gpu_variant:
  - none
  - cuda-12                             # [linux or (win and x86_64)]
  - cuda-13                             # [win or linux]
cuda_compiler_version:
  - none
  - 12.9                                # [linux or (win and x86_64)]
  - 13.0                                # [linux or (win and x86_64)]
  # win-arm64: CUDA 13.4 is the only toolkit NVIDIA ships for Windows on Arm
  - 13.4                                # [win and arm64]

# No GCC downgrade needed: pyarrow does not compile .cu files.
# It builds Python bindings that link against arrow-cpp's CUDA library (libarrow_cuda).

zip_keys:
  -
    - gpu_variant
    - cuda_compiler_version
